services:
  - type: web
    name: securedb
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SECUREDB_MASTER_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: SECUREDB_STORAGE_DIR
        value: "/app/storage/backups"
      - key: SECUREDB_TEMP_DIR
        value: "/app/storage/temp"
      - key: DATABASE_URL
        fromDatabase:
          name: securedb-postgres
          property: connectionString

databases:
  - name: securedb-postgres
    databaseName: securedb
    user: securedb_admin
    plan: free
    region: oregon
